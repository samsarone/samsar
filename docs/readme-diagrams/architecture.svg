<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="318" viewBox="0 0 1200 318" role="img" aria-labelledby="title desc">
<title id="title">Standalone architecture</title>
<desc id="desc">Studio and SDK clients call the processor. Workers consume MongoDB-backed jobs and call model providers. The processor also calls providers directly for inference and embeddings. Services share state and media storage.</desc>
<defs>
<marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#818b98"/></marker>
</defs>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<rect x="12" y="22" width="271.5" height="188" rx="10" fill="#0969da" fill-opacity="0.07" stroke="#0969da" stroke-opacity="0.45"/>
<text x="28" y="49" font-size="12" font-weight="650" fill="#0969da" text-anchor="start">INTERFACE</text>
<text x="28" y="81" font-size="23" font-weight="650" fill="#1f2328" text-anchor="start">Studio + SDK</text>
<text x="28" y="111" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Create, edit, automate</text>
<text x="28" y="134" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Poll status or stream</text>
<text x="28" y="157" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Preview and download</text>
<path d="M28 173 H267.5" stroke="#d1d9e0"/>
<text x="28" y="196" font-size="14" font-weight="400" fill="#59636e" text-anchor="start">Browser / API client</text>
