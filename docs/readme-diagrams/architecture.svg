<rect x="916.5" y="22" width="271.5" height="188" rx="10" fill="#9a6700" fill-opacity="0.07" stroke="#9a6700" stroke-opacity="0.45"/>
<text x="932.5" y="49" font-size="12" font-weight="650" fill="#9a6700" text-anchor="start">MODELS</text>
<text x="932.5" y="81" font-size="23" font-weight="650" fill="#1f2328" text-anchor="start">Providers</text>
<text x="932.5" y="111" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Samsar managed API</text>
<text x="932.5" y="134" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Native / partner APIs</text>
