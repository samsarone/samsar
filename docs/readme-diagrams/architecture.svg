<text x="750.75" y="238" font-size="15" font-weight="400" fill="#59636e" text-anchor="middle">Direct inference + embeddings</text>
<text x="16" y="298" font-size="16" font-weight="400" fill="#59636e" text-anchor="start">Shared: MongoDB state · Media volumes + object storage · Optional Loki / Grafana logs</text>
