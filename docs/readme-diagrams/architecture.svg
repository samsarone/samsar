<rect x="313.5" y="22" width="271.5" height="188" rx="10" fill="#8250df" fill-opacity="0.07" stroke="#8250df" stroke-opacity="0.45"/>
<text x="329.5" y="49" font-size="12" font-weight="650" fill="#8250df" text-anchor="start">CONTROL</text>
<text x="329.5" y="81" font-size="23" font-weight="650" fill="#1f2328" text-anchor="start">Processor API</text>
<text x="329.5" y="111" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Auth, credits, validation</text>
<text x="329.5" y="134" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Sessions and job state</text>
<text x="329.5" y="157" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Search and assistants</text>
<path d="M329.5 173 H569" stroke="#d1d9e0"/>
<text x="329.5" y="196" font-size="14" font-weight="400" fill="#59636e" text-anchor="start">processor</text>
<path d="M585 120 H615" fill="none" stroke="#818b98" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect x="615" y="22" width="271.5" height="188" rx="10" fill="#1a7f37" fill-opacity="0.07" stroke="#1a7f37" stroke-opacity="0.45"/>
<text x="631" y="49" font-size="12" font-weight="650" fill="#1a7f37" text-anchor="start">EXECUTION</text>
<text x="631" y="81" font-size="23" font-weight="650" fill="#1f2328" text-anchor="start">Workers</text>
<text x="631" y="111" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Workflow coordination</text>
<text x="631" y="134" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Image, audio and video</text>
