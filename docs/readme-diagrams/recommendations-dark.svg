<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="268" viewBox="0 0 1200 268" role="img" aria-labelledby="title desc">
<title id="title">Recommendations</title>
<desc id="desc">A text or structured reference is matched against an existing embedding template through the shared search implementation, returning compact ID and score pairs.</desc>
<defs>
<marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#9198a1"/></marker>
</defs>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<rect x="12" y="22" width="271.5" height="188" rx="10" fill="#79c0ff" fill-opacity="0.10" stroke="#79c0ff" stroke-opacity="0.45"/>
<text x="28" y="49" font-size="12" font-weight="650" fill="#79c0ff" text-anchor="start">01 / INPUT</text>
<text x="28" y="81" font-size="23" font-weight="650" fill="#f0f6fc" text-anchor="start">Reference</text>
<text x="28" y="111" font-size="16" font-weight="400" fill="#f0f6fc" text-anchor="start">Text or structured item</text>
<text x="28" y="134" font-size="16" font-weight="400" fill="#f0f6fc" text-anchor="start">Existing template ID</text>
<text x="28" y="157" font-size="16" font-weight="400" fill="#f0f6fc" text-anchor="start">Limit and filters</text>
<path d="M28 173 H267.5" stroke="#3d444d"/>
<text x="28" y="196" font-size="14" font-weight="400" fill="#b1bac4" text-anchor="start">API client</text>
<path d="M283.5 120 H313.5" fill="none" stroke="#9198a1" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="313.5" y="22" width="271.5" height="188" rx="10" fill="#d2a8ff" fill-opacity="0.10" stroke="#d2a8ff" stroke-opacity="0.45"/>
<text x="329.5" y="49" font-size="12" font-weight="650" fill="#d2a8ff" text-anchor="start">02 / CONSTRAIN</text>
<text x="329.5" y="81" font-size="23" font-weight="650" fill="#f0f6fc" text-anchor="start">Match rules</text>
<text x="329.5" y="111" font-size="16" font-weight="400" fill="#f0f6fc" text-anchor="start">Normalize the reference</text>
<text x="329.5" y="134" font-size="16" font-weight="400" fill="#f0f6fc" text-anchor="start">Apply configured filters</text>
<text x="329.5" y="157" font-size="16" font-weight="400" fill="#f0f6fc" text-anchor="start">Choose candidate count</text>
<path d="M329.5 173 H569" stroke="#3d444d"/>
<text x="329.5" y="196" font-size="14" font-weight="400" fill="#b1bac4" text-anchor="start">processor</text>
<path d="M585 120 H615" fill="none" stroke="#9198a1" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="615" y="22" width="271.5" height="188" rx="10" fill="#7ee787" fill-opacity="0.10" stroke="#7ee787" stroke-opacity="0.45"/>
<text x="631" y="49" font-size="12" font-weight="650" fill="#7ee787" text-anchor="start">03 / REUSE</text>
<text x="631" y="81" font-size="23" font-weight="650" fill="#f0f6fc" text-anchor="start">Shared search</text>
<text x="631" y="111" font-size="16" font-weight="400" fill="#f0f6fc" text-anchor="start">Embed the reference</text>
<text x="631" y="134" font-size="16" font-weight="400" fill="#f0f6fc" text-anchor="start">Retrieve similar records</text>
<text x="631" y="157" font-size="16" font-weight="400" fill="#f0f6fc" text-anchor="start">Reuse the stored corpus</text>
<path d="M631 173 H870.5" stroke="#3d444d"/>
<text x="631" y="196" font-size="14" font-weight="400" fill="#b1bac4" text-anchor="start">embeddings + MongoDB</text>
<path d="M886.5 120 H916.5" fill="none" stroke="#9198a1" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="916.5" y="22" width="271.5" height="188" rx="10" fill="#e3b341" fill-opacity="0.10" stroke="#e3b341" stroke-opacity="0.45"/>
<text x="932.5" y="49" font-size="12" font-weight="650" fill="#e3b341" text-anchor="start">04 / RETURN</text>
<text x="932.5" y="81" font-size="23" font-weight="650" fill="#f0f6fc" text-anchor="start">Matches</text>
<text x="932.5" y="111" font-size="16" font-weight="400" fill="#f0f6fc" text-anchor="start">Compact ID + score pairs</text>
<text x="932.5" y="134" font-size="16" font-weight="400" fill="#f0f6fc" text-anchor="start">No LLM reranking</text>
<text x="932.5" y="157" font-size="16" font-weight="400" fill="#f0f6fc" text-anchor="start">Related items / products</text>
<path d="M932.5 173 H1172" stroke="#3d444d"/>
<text x="932.5" y="196" font-size="14" font-weight="400" fill="#b1bac4" text-anchor="start">processor</text>
<text x="16" y="248" font-size="16" font-weight="400" fill="#b1bac4" text-anchor="start">Uses the same embedding templates as search. A recommendation request does not rebuild the index.</text>
</g>
</svg>
