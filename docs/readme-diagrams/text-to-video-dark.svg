<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="268" viewBox="0 0 1200 268" role="img" aria-labelledby="title desc">
<title id="title">Text to video</title>
<desc id="desc">Validate a prompt, save a narrative plan, generate images and audio in parallel, animate and finish scenes, then render and deliver the video.</desc>
<defs>
<marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#9198a1"/></marker>
</defs>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<rect x="12" y="22" width="211.2" height="188" rx="10" fill="#79c0ff" fill-opacity="0.10" stroke="#79c0ff" stroke-opacity="0.45"/>
<text x="28" y="49" font-size="12" font-weight="650" fill="#79c0ff" text-anchor="start">01 / VALIDATE</text>
<text x="28" y="81" font-size="23" font-weight="650" fill="#f0f6fc" text-anchor="start">Request</text>
<text x="28" y="111" font-size="16" font-weight="400" fill="#f0f6fc" text-anchor="start">Prompt and settings</text>
<text x="28" y="134" font-size="16" font-weight="400" fill="#f0f6fc" text-anchor="start">Auth, credits, models</text>
<text x="28" y="157" font-size="16" font-weight="400" fill="#f0f6fc" text-anchor="start">Return request ID</text>
<path d="M28 173 H207.2" stroke="#3d444d"/>
<text x="28" y="196" font-size="14" font-weight="400" fill="#b1bac4" text-anchor="start">processor</text>
<path d="M223.2 120 H253.2" fill="none" stroke="#9198a1" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="253.2" y="22" width="211.2" height="188" rx="10" fill="#d2a8ff" fill-opacity="0.10" stroke="#d2a8ff" stroke-opacity="0.45"/>
<text x="269.2" y="49" font-size="12" font-weight="650" fill="#d2a8ff" text-anchor="start">02 / PLAN</text>
<text x="269.2" y="81" font-size="23" font-weight="650" fill="#f0f6fc" text-anchor="start">Narrative</text>
<text x="269.2" y="111" font-size="16" font-weight="400" fill="#f0f6fc" text-anchor="start">Theme and scene script</text>
<text x="269.2" y="134" font-size="16" font-weight="400" fill="#f0f6fc" text-anchor="start">Validate speech length</text>
<text x="269.2" y="157" font-size="16" font-weight="400" fill="#f0f6fc" text-anchor="start">Save scene + audio plan</text>
<path d="M269.2 173 H448.4" stroke="#3d444d"/>
<text x="269.2" y="196" font-size="14" font-weight="400" fill="#b1bac4" text-anchor="start">processor builder</text>
<path d="M464.4 120 H494.4" fill="none" stroke="#9198a1" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="494.4" y="22" width="211.2" height="188" rx="10" fill="#7ee787" fill-opacity="0.10" stroke="#7ee787" stroke-opacity="0.45"/>
<text x="510.4" y="49" font-size="12" font-weight="650" fill="#7ee787" text-anchor="start">03 / PARALLEL</text>
<text x="510.4" y="81" font-size="23" font-weight="650" fill="#f0f6fc" text-anchor="start">Generate</text>
<path d="M520.4 105 H513.4 V151 H520.4 M680.6 105 H687.6 V151 H680.6" fill="none" stroke="#7ee787" stroke-width="1.5"/>
<text x="600" y="110" font-size="16" font-weight="400" fill="#f0f6fc" text-anchor="middle">Scene images</text>
<text x="600" y="133" font-size="16" font-weight="400" fill="#f0f6fc" text-anchor="middle">Speech</text>
<text x="600" y="156" font-size="16" font-weight="400" fill="#f0f6fc" text-anchor="middle">Music</text>
<path d="M510.4 173 H689.6" stroke="#3d444d"/>
<text x="510.4" y="196" font-size="14" font-weight="400" fill="#b1bac4" text-anchor="start">image + audio workers</text>
<path d="M705.6 120 H735.6" fill="none" stroke="#9198a1" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="735.6" y="22" width="211.2" height="188" rx="10" fill="#e3b341" fill-opacity="0.10" stroke="#e3b341" stroke-opacity="0.45"/>
<text x="751.6" y="49" font-size="12" font-weight="650" fill="#e3b341" text-anchor="start">04 / FINISH</text>
<text x="751.6" y="81" font-size="23" font-weight="650" fill="#f0f6fc" text-anchor="start">Animate</text>
<text x="751.6" y="111" font-size="16" font-weight="400" fill="#f0f6fc" text-anchor="start">Image-to-video clips</text>
<text x="751.6" y="134" font-size="16" font-weight="400" fill="#f0f6fc" text-anchor="start">Optional lip sync / SFX</text>
<text x="751.6" y="157" font-size="16" font-weight="400" fill="#f0f6fc" text-anchor="start">Avatar and subtitles</text>
<path d="M751.6 173 H930.8" stroke="#3d444d"/>
<text x="751.6" y="196" font-size="14" font-weight="400" fill="#b1bac4" text-anchor="start">AI video + listener</text>
<path d="M946.8 120 H976.8" fill="none" stroke="#9198a1" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="976.8" y="22" width="211.2" height="188" rx="10" fill="#79c0ff" fill-opacity="0.10" stroke="#79c0ff" stroke-opacity="0.45"/>
<text x="992.8" y="49" font-size="12" font-weight="650" fill="#79c0ff" text-anchor="start">05 / DELIVER</text>
<text x="992.8" y="81" font-size="23" font-weight="650" fill="#f0f6fc" text-anchor="start">Render</text>
<text x="992.8" y="111" font-size="16" font-weight="400" fill="#f0f6fc" text-anchor="start">Frames + audio mix</text>
<text x="992.8" y="134" font-size="16" font-weight="400" fill="#f0f6fc" text-anchor="start">FFmpeg composition</text>
<text x="992.8" y="157" font-size="16" font-weight="400" fill="#f0f6fc" text-anchor="start">URL, status, webhook</text>
<path d="M992.8 173 H1172" stroke="#3d444d"/>
<text x="992.8" y="196" font-size="14" font-weight="400" fill="#b1bac4" text-anchor="start">frames + video workers</text>
<text x="16" y="248" font-size="16" font-weight="400" fill="#b1bac4" text-anchor="start">Motion waits for images, speech and music. Eligible finishing jobs overlap; final rendering joins them.</text>
</g>
</svg>
