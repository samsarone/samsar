<svg xmlns="http://www.w3.org/2000/svg" width="180" height="60" viewBox="0 0 180 60" role="img" aria-labelledby="title desc">
  <title id="title">Samsar</title>
  <desc id="desc">Transparent Samsar wordmark matching the client navigation.</desc>

  <style>
    .samsar { fill: #0f1a2f; }

    @media (prefers-color-scheme: dark) {
      .samsar { fill: #89dcff; }
    }
  </style>

  <text
    x="90"
    y="40"
    font-family="Inter, Segoe UI, Arial, sans-serif"
    font-size="24"
    font-weight="900"
    letter-spacing="4.32"
    text-anchor="middle"
  >
    <tspan class="samsar">SAMSAR</tspan>
  </text>
</svg>
