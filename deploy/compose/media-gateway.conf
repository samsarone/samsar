server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    location = /__samsar_media_health {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "samsar-media-gateway\n";
    }

    # nginx's bundled mime.types omits several provider-facing audio/video
    # formats. Exact media probes reject application/octet-stream, so publish
    # explicit media types for every format used by Docker public adapters.
    location ~* \.wav$ {
        default_type audio/wav;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Origin, Accept, Content-Type, Authorization" always;
        add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range, Content-Type, ETag, Last-Modified" always;
        if ($request_method = OPTIONS) { return 204; }
        try_files $uri =404;
    }

    location ~* \.flac$ {
        default_type audio/flac;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Origin, Accept, Content-Type, Authorization" always;
        add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range, Content-Type, ETag, Last-Modified" always;
        if ($request_method = OPTIONS) { return 204; }
        try_files $uri =404;
    }

    location ~* \.aac$ {
        default_type audio/aac;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Origin, Accept, Content-Type, Authorization" always;
        add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range, Content-Type, ETag, Last-Modified" always;
        if ($request_method = OPTIONS) { return 204; }
        try_files $uri =404;
    }

    location ~* \.(oga|opus)$ {
        default_type audio/ogg;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Origin, Accept, Content-Type, Authorization" always;
        add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range, Content-Type, ETag, Last-Modified" always;
        if ($request_method = OPTIONS) { return 204; }
        try_files $uri =404;
    }

    location ~* \.mkv$ {
        default_type video/x-matroska;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Origin, Accept, Content-Type, Authorization" always;
        add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range, Content-Type, ETag, Last-Modified" always;
        if ($request_method = OPTIONS) { return 204; }
        try_files $uri =404;
    }

    location / {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Origin, Accept, Content-Type, Authorization" always;
        add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range, Content-Type, ETag, Last-Modified" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        try_files $uri =404;
    }
}
