resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    location = /__samsar_media_health {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "samsar-media-gateway\n";
    }

    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "User-agent: *\nAllow: /\n";
    }

    # Private files always pass through the processor's authentication and
    # ownership policy, including legacy root-level media URLs.
    location ~ ^/(assets|assets_v2|generations|outpaint|video|ai_video|audio|music|temp_images|user_resources)/ {
        set $asset_processor http://processor:3002;
        proxy_pass $asset_processor$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location / { return 404; }
}
