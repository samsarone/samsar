name: samsar

x-service-env: &service-env
  # Provider credentials, including KIMI_K3_API_KEY, are rendered once into
  # root.env and inherited by every backend inference consumer.
  env_file:
    - ../../runtime/secrets/root.env
  environment:
    CURRENT_ENV: standalone
    SAMSAR_DEPLOYMENT_EDITION: standalone
    SAMSAR_RUNTIME: docker
    SAMSAR_ASSETS_ROOT: /assets
    SAMSAR_ASSETS_V2_ROOT: /assets_v2
    SAMSAR_INTERNAL_MEDIA_BASE_URL: ${SAMSAR_INTERNAL_MEDIA_BASE_URL:-http://media-gateway}
  depends_on:
    mongo:
      condition: service_healthy
      required: false
  restart: unless-stopped
  volumes:
    - media-assets:/assets
    - media-assets-v2:/assets_v2
    - persistent-data:/persistent
    - ../../runtime/config:/persistent/config
    - ../../runtime/fonts:/usr/local/share/fonts:ro

services:
  genblaze:
    profiles: ["genblaze"]
    image: samsar-genblaze-gateway:local
    build:
      context: ../../services/genblaze-gateway
    env_file:
      - ../../runtime/secrets/genblaze.env
    environment:
      PYTHONUNBUFFERED: "1"
      GENBLAZE_MODEL_CATALOG_PATH: /app/config/genblaze-model-catalog.json
      SAMSAR_MEDIA_TUNNEL_REFRESH_URL: http://media-tunnel-controller:8081/refresh
    volumes:
      - ../../runtime/config/genblaze-model-catalog.json:/app/config/genblaze-model-catalog.json:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    init: true
    restart: unless-stopped

  processor:
    <<: *service-env
    profiles: ["core"]
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        NODE_VERSION: "24"
        SERVICE_PATH: services/processor
    ports:
      - "3002:3002"
    depends_on:
      mongo:
        condition: service_healthy
        required: false
      minio:
        condition: service_started
        required: false

  client:
    profiles: ["core"]
    build:
      context: ../../apps/samsar-client
      args:
        VITE_PROCESSOR_API: ${PROCESSOR_API:-http://localhost:3002}
        VITE_CLIENT_URL: ${CLIENT_APP:-http://localhost:3000}
        VITE_STATIC_CDN_URL: ${PUBLIC_STATIC_CDN_URL:-http://localhost:3002}
        VITE_CURRENT_ENV: standalone
        VITE_SAMSAR_DEPLOYMENT_EDITION: standalone
        VITE_DOCKER_INSTALL: "true"
        VITE_SETUP_WIZARD_API: http://localhost:8089
    ports:
      - "3000:3000"

  generator:
    <<: *service-env
    profiles: ["workers"]
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        NODE_VERSION: "24"
        SERVICE_PATH: services/generator

  audio-generator:
    <<: *service-env
    profiles: ["workers"]
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        NODE_VERSION: "24"
        SERVICE_PATH: services/audio-generator

  frames-processor:
    <<: *service-env
    profiles: ["workers"]
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        NODE_VERSION: "22"
        SERVICE_PATH: services/frames-processor

  video-generator:
    <<: *service-env
    profiles: ["workers"]
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        NODE_VERSION: "22"
        SERVICE_PATH: services/video-generator

  ai-video-layer-generator:
    <<: *service-env
    profiles: ["workers"]
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        NODE_VERSION: "24"
        SERVICE_PATH: services/ai-video-layer-generator

  express-video-listener:
    <<: *service-env
    profiles: ["workers"]
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        NODE_VERSION: "24"
        SERVICE_PATH: services/express-video-listener

  assistant-query-processor:
    <<: *service-env
    profiles: ["workers"]
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        NODE_VERSION: "24"
        SERVICE_PATH: services/assistant-query-processor

  task-processor:
    <<: *service-env
    profiles: ["workers"]
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        NODE_VERSION: "24"
        SERVICE_PATH: services/task-processor

  docker-cleanup:
    profiles: ["workers"]
    restart: unless-stopped
    build:
      context: ../../services/docker-cleanup
    environment:
      SAMSAR_ASSETS_V2_ROOT: /assets_v2
      CLEANUP_MIN_AGE_HOURS: "${CLEANUP_MIN_AGE_HOURS:-24}"
      CLEANUP_CRON_SCHEDULE: "${CLEANUP_CRON_SCHEDULE:-17 */3 * * *}"
      CLEANUP_ON_START: "${CLEANUP_ON_START:-true}"
      CLEANUP_DRY_RUN: "${CLEANUP_DRY_RUN:-false}"
    volumes:
      - media-assets-v2:/assets_v2

  mongo-auth-bootstrap:
    profiles: ["local-mongo"]
    image: mongo:7.0.39
    user: mongodb
    network_mode: none
    env_file:
      - ../../runtime/secrets/mongo.env
    entrypoint: ["/bin/bash", "/opt/samsar/bootstrap-auth.sh"]
    volumes:
      - mongo-data:/data/db
      - ./mongo/bootstrap-auth.sh:/opt/samsar/bootstrap-auth.sh:ro
    restart: "no"

  mongo:
    profiles: ["local-mongo"]
    image: mongo:7.0.39
    command: ["mongod", "--auth", "--bind_ip_all"]
    env_file:
      - ../../runtime/secrets/mongo.env
    volumes:
      - mongo-data:/data/db
    depends_on:
      mongo-auth-bootstrap:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host 127.0.0.1 --username "$${MONGO_APP_USERNAME}"
          --password "$${MONGO_APP_PASSWORD}" --authenticationDatabase admin
          --eval 'db.adminCommand({ ping: 1 })' >/dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio:
    profiles: ["minio"]
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    env_file:
      - ../../runtime/secrets/minio.env
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"

  media-gateway:
    profiles: ["local-media"]
    image: samsar-media-gateway:local
    build:
      context: ./media-gateway
    volumes:
      - ./media-gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - media-assets:/usr/share/nginx/html/assets:ro
      - media-assets-v2:/usr/share/nginx/html/assets_v2:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/__samsar_media_health | grep -qx samsar-media-gateway"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  media-tunnel-controller:
    profiles: ["local-media"]
    build:
      context: ./media-tunnel-controller
      args:
        CLOUDFLARED_IMAGE: ${SAMSAR_CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    init: true
    environment:
      SAMSAR_RUNTIME_CONFIG_FILE: /persistent/config/samsar.config.json
      SAMSAR_MEDIA_TUNNEL_REFRESH_REQUEST_PATH: /persistent/config/media-tunnel-refresh.request.json
      SAMSAR_MEDIA_TUNNEL_READY_FILE: /tmp/samsar-media-tunnel.ready
      SAMSAR_INTERNAL_MEDIA_BASE_URL: http://media-gateway
      SAMSAR_MEDIA_TUNNEL_HEALTH_PATH: ${SAMSAR_MEDIA_TUNNEL_HEALTH_PATH:-/__samsar_media_health}
      SAMSAR_MEDIA_TUNNEL_HEALTH_MARKER: samsar-media-gateway
      SAMSAR_CLOUDFLARED_PROTOCOL: ${SAMSAR_CLOUDFLARED_PROTOCOL:-http2}
      SAMSAR_MEDIA_TUNNEL_MONITOR_INTERVAL_MS: ${SAMSAR_MEDIA_TUNNEL_MONITOR_INTERVAL_MS:-5000}
      SAMSAR_MEDIA_TUNNEL_START_TIMEOUT_MS: ${SAMSAR_MEDIA_TUNNEL_START_TIMEOUT_MS:-60000}
      SAMSAR_MEDIA_TUNNEL_HEALTH_TIMEOUT_MS: ${SAMSAR_MEDIA_TUNNEL_HEALTH_TIMEOUT_MS:-60000}
      SAMSAR_MEDIA_TUNNEL_REQUEST_TIMEOUT_MS: ${SAMSAR_MEDIA_TUNNEL_REQUEST_TIMEOUT_MS:-5000}
      SAMSAR_MEDIA_TUNNEL_DNS_SETTLE_MS: ${SAMSAR_MEDIA_TUNNEL_DNS_SETTLE_MS:-5000}
      SAMSAR_MEDIA_TUNNEL_RESTART_DELAY_MS: ${SAMSAR_MEDIA_TUNNEL_RESTART_DELAY_MS:-3000}
      SAMSAR_MEDIA_TUNNEL_FAILURE_THRESHOLD: ${SAMSAR_MEDIA_TUNNEL_FAILURE_THRESHOLD:-3}
      SAMSAR_MEDIA_TUNNEL_REFRESH_PORT: "8081"
    volumes:
      - ../../runtime/config:/persistent/config
    depends_on:
      media-gateway:
        condition: service_healthy
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "test -s $${SAMSAR_MEDIA_TUNNEL_READY_FILE:-/tmp/samsar-media-tunnel.ready}"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 75s
    restart: unless-stopped

  reverse-proxy:
    profiles: ["reverse-proxy"]
    image: nginx:stable-alpine
    depends_on:
      - client
      - processor
    volumes:
      - ../../runtime/reverse-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../runtime/reverse-proxy/certbot/www:/var/www/certbot:ro
      - ../../runtime/reverse-proxy/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped

  loki:
    profiles: ["logger"]
    image: grafana/loki:2.9.8
    command: -config.file=/etc/loki/local-config.yml
    ports:
      - "127.0.0.1:${LOKI_PORT:-4100}:3100"
    volumes:
      - ./logger/loki-config.yml:/etc/loki/local-config.yml:ro
      - loki-data:/loki
    restart: unless-stopped

  promtail:
    profiles: ["logger"]
    image: grafana/promtail:2.9.8
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./logger/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-data:/var/lib/promtail
    depends_on:
      - loki
    healthcheck:
      test: ["CMD", "/usr/bin/promtail", "-config.file=/etc/promtail/config.yml", "-check-syntax"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  grafana:
    profiles: ["logger"]
    image: grafana/grafana:10.4.3
    environment:
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN:-localhost}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:4000/}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_LOG_MODE: console
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/docker/docker-logs-overview.json
    env_file:
      - ../../runtime/secrets/grafana.env
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-4000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./logger/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./logger/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  media-assets:
  media-assets-v2:
  persistent-data:
  mongo-data:
  minio-data:
  loki-data:
  promtail-data:
  grafana-data:
